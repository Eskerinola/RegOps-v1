name: Deploy Apps Script

on:
  push:
    branches: [main]
    paths:
      - "*.js"
      - "appsscript.json"
      - ".clasp.json"
      - ".github/workflows/deploy-apps-script.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regops-v1-apps-script
  cancel-in-progress: true

jobs:
  deploy:
    name: Push to Apps Script
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "Missing GitHub secret CLASPRC_JSON"
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"

      - name: Deploy to Apps Script
        run: npx --yes @google/clasp@3.3.0 push --force
